name: Build GitHub Release

# Releases are cut by pushing a SemVer tag that matches the VERSION file:
#   python scripts/version.py bump minor   (or: set 1.3.0)
#   git commit -am "chore(release): 1.3.0" && git tag v1.3.0 && git push --follow-tags
# See docs/versioning.md. Tags with a hyphen (v1.3.0-rc.1) publish as pre-releases.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild, for example v1.3.0
        required: true
      revit_version:
        description: Revit version to package, or All for 2024-2027
        required: true
        default: "All"
      dry_run:
        description: Build and test everything, but do not create or update the GitHub release or start the registry publish. Artifacts are attached to the run instead.
        type: boolean
        required: false
        default: false
      ref:
        description: Git ref to build instead of the tag, for testing a branch. Only allowed together with dry_run.
        required: false
        default: ""

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
      id-token: write       # build provenance attestation
      attestations: write

    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { $env:INPUT_TAG }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '$tag' is not vMAJOR.MINOR.PATCH[-prerelease]" }
          if ($env:INPUT_REF -ne '' -and $env:INPUT_DRY_RUN -ne 'true') { throw "The ref input is only allowed together with dry_run, so a release is never built from an untagged ref." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          "prerelease=$($tag.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify tag, VERSION, manifests and changelog agree
        shell: pwsh
        run: python scripts/version.py check --tag "${{ steps.tag.outputs.tag }}"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Python build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade build pytest
          python -m pip install -e "packages/mcp-server-revit[dev]"

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest packages/mcp-server-revit/tests

      - name: Set up Node for the VS Code extension
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24   # npm 11; npm 10 cannot install the extension's dependencies
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Build and test the VS Code extension
        working-directory: extensions/vscode
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Extension dependency install failed" }
          npm run compile
          if ($LASTEXITCODE -ne 0) { throw "Extension compile failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Extension tests failed" }
          npm run package
          if ($LASTEXITCODE -ne 0) { throw "Extension packaging failed" }

      - name: Build release artifacts
        shell: pwsh
        run: >
          ./scripts/build-release.ps1
          -Version "${{ steps.tag.outputs.version }}"
          -RevitVersion "${{ inputs.revit_version || 'All' }}"
          -VSCodePackage "extensions/vscode/aec-model-bridge-${{ steps.tag.outputs.version }}.vsix"

      # The double-click installer carries all four Revit years, so it needs the full package.
      - name: Install Inno Setup
        if: ${{ (inputs.revit_version || 'All') == 'All' }}
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }

      - name: Build Windows installer
        if: ${{ (inputs.revit_version || 'All') == 'All' }}
        shell: pwsh
        run: >
          ./scripts/build-installer.ps1
          -Version "${{ steps.tag.outputs.version }}"
          -SkipPackage
          -OutputDir dist/release
          -UpdateChecksums

      - name: Smoke-test the installer (silent install, upgrade, failure, uninstall)
        if: ${{ (inputs.revit_version || 'All') == 'All' }}
        shell: pwsh
        run: >
          ./scripts/test-installer.ps1
          -Installer "dist/release/AECModelBridge-Setup-${{ steps.tag.outputs.version }}.exe"
          -AllowOverwrite

      # Software Bill of Materials for the Python package, from the locked dependency
      # set (uv.lock), as CycloneDX JSON. It lands in dist/release, so it is uploaded
      # with the release, listed in SHA256SUMS.txt and covered by the provenance
      # attestation below (which attests dist/release/*).
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Generate CycloneDX SBOM and refresh SHA256SUMS.txt
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          CYCLONEDX_BOM_VERSION: "7.2.1"
        run: |
          python -m pip install "cyclonedx-bom==$env:CYCLONEDX_BOM_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "cyclonedx-bom install failed" }
          $req = Join-Path $env:RUNNER_TEMP 'sbom-requirements.txt'
          Push-Location packages/mcp-server-revit
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt -o $req
          if ($LASTEXITCODE -ne 0) { throw "uv export failed" }
          $sbom = Join-Path $env:GITHUB_WORKSPACE "dist/release/aec-model-bridge-$env:RELEASE_VERSION.cdx.json"
          cyclonedx-py requirements $req --pyproject pyproject.toml --sv 1.6 --of JSON --validate -o $sbom
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed" }
          Pop-Location
          # Rewrite the checksum file so it also lists the SBOM (same format as build-release.ps1).
          $dir = 'dist/release'
          Get-ChildItem -Path $dir -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object Name |
            ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content -LiteralPath (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii
          Get-Content (Join-Path $dir 'SHA256SUMS.txt')

      - name: Write release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          python scripts/version.py notes $version | Out-File -Encoding utf8 release-notes.md
          if (Test-Path "dist/release/AECModelBridge-Setup-$version.exe") {
            Add-Content -Encoding utf8 release-notes.md @"

          **Easiest install:** download ``AECModelBridge-Setup-$version.exe`` below, double-click it and follow the wizard. It detects your Revit versions and sets everything up. Checksums are in ``SHA256SUMS.txt``, and the Python dependency SBOM (CycloneDX) is ``aec-model-bridge-$version.cdx.json``. See docs/supply-chain.md for how to verify downloads.
          "@
          }

      - name: Upload artifacts (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run-${{ steps.tag.outputs.version }}
          path: |
            dist/release/*
            release-notes.md
          if-no-files-found: error

      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*

      - name: Create or update GitHub release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag (Get-ChildItem dist/release/*).FullName --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            $flags = @()
            if ('${{ steps.tag.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
            gh release create $tag (Get-ChildItem dist/release/*).FullName `
              --verify-tag --title "AEC Model Bridge $tag" --notes-file release-notes.md @flags
          }

      - name: Publish to the MCP Registry
        if: ${{ steps.tag.outputs.prerelease == 'false' && !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # A release created with the default token does not fire release-event workflows,
        # but workflow_dispatch does, so start the registry publish explicitly.
        run: gh workflow run publish-mcp.yml --ref "${{ steps.tag.outputs.tag }}"
