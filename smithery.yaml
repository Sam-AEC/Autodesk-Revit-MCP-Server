# Smithery build/launch configuration. Runs the server from the root Dockerfile in
# MOCK mode so Smithery can start it and list its tools without Autodesk Revit.
# For real Revit use, install locally (see README) and run with MCP_REVIT_MODE=bridge.
runtime: "container"
build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."
startCommand:
  type: "stdio"
  configSchema:
    type: "object"
    properties:
      mode:
        type: "string"
        enum: ["mock", "bridge"]
        default: "mock"
        description: "mock returns canned responses (no Revit needed); bridge talks to the AEC Model Bridge add-in inside a running Revit."
      bridgeUrl:
        type: "string"
        default: ""
        description: "Leave empty: the server finds the running Revit by itself. Set a URL only to pin one add-in."
  commandFunction: |-
    (config) => ({
      command: "aec-model-bridge",
      args: [],
      env: {
        MCP_REVIT_MODE: config.mode || "mock",
        MCP_REVIT_BRIDGE_URL: config.bridgeUrl || "",
        MCP_REVIT_WORKSPACE_DIR: "/workspace",
        MCP_REVIT_ALLOWED_DIRECTORIES: "/workspace"
      }
    })
